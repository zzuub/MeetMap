name: MeetMap CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint

      - name: Test frontend
        run: npm test

      # 날짜 판정(`weekRangeKst`)이 실행 환경 타임존을 읽지 않는지 실증한다.
      #
      # 구현은 `getUTC*`/`Date.UTC` 만 쓰지만 그건 구조적 근거일 뿐이다.
      # `getUTCDay()` 가 `getDay()` 로 한 글자 바뀌면 서버(UTC)와 브라우저(KST)가
      # 서로 다른 주를 계산하고, `when=THIS_WEEK` 에서 소개팅이 통째로 사라진다.
      #
      # 이 회귀는 **오프셋 대역마다 다른 시각에서만** 드러난다. 짝이 되는 픽스처가
      # `derive.test.ts` 의 weekRangeKst 블록 뒤쪽 두 케이스이고, 아래 두 TZ 가
      # 각각 그중 하나를 깨뜨린다 — 둘 다 돌려야 양쪽 대역이 닫힌다.
      # (기본 스텝은 러너 기본값인 UTC 로 이미 돌았다.)
      - name: Test frontend (timezone independence)
        run: |
          for tz in America/Los_Angeles Pacific/Kiritimati; do
            echo "::group::TZ=$tz"
            TZ="$tz" npm test
            echo "::endgroup::"
          done

      # 빌드 stdout 의 라우트 표(`○` 정적 / `ƒ` 동적)를 버리지 않고 검사한다.
      # 목 회차의 날짜가 이번 주 기준 상대값이라(`decisions.md` 4.31) `eventApi` 를
      # 무는 페이지가 프리렌더되면 **빌드한 주의 날짜가 HTML 에 굳는다.**
      # `/design-system` 이 실제로 그랬고, 이 표가 내내 말하고 있었는데 아무도 안 봤다.
      # `shell: bash` 를 명시하는 것이 `pipefail` 을 켜는 방법이다. 기본 셸(`bash -e`)
      # 에는 없어서, 파이프를 쓰면 `tee` 의 종료 코드가 이겨 **빌드 실패가 통과로 보인다.**
      - name: Build frontend
        shell: bash
        run: npm run build | tee build.log

      - name: Assert eventApi routes are not prerendered
        run: node scripts/assert-dynamic-routes.mjs build.log

  backend-build:
    name: Backend Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./backend/meetmap

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build backend without tests
        run: ./gradlew clean build -x test
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
  <style>
    body{margin:0;background:#FBFAF6;}
    a{color:#14382A;text-decoration:none}
    a:hover{color:#17170F}
    @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  </style>
</helmet>

<div style="font-family:'Pretendard',sans-serif;color:#14382A;min-height:100vh;background:#FBFAF6;display:flex;justify-content:center">
<div style="width:100%;max-width:430px;min-height:100vh;position:relative;background:#FFFFFF;box-shadow:0 0 0 1px #EDE7D6">

  <header style="position:sticky;top:0;z-index:20;background:rgba(255,255,255,0.94);backdrop-filter:blur(10px);border-bottom:1px solid #EDE7D6;height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 18px">
    <span style="font-size:19px;color:#59503E;cursor:pointer;line-height:1">←</span>
    <span style="font-size:14.5px;font-weight:700">소셜테이블 후기</span>
    <span style="width:19px"></span>
  </header>

  <main style="padding:18px 18px 32px">

    <div style="background:#fff;border:1px solid #EDE7D6;border-radius:18px;padding:20px;margin-bottom:14px">
      <div style="display:flex;align-items:center;gap:18px;margin-bottom:18px">
        <div style="text-align:center;flex-shrink:0">
          <div style="font-family:Georgia,serif;font-size:32px;font-weight:700;line-height:1">4.6</div>
          <div style="font-size:12px;color:#96A377;margin-top:5px;letter-spacing:1px">★★★★★</div>
          <div style="font-size:11px;color:#59503E;margin-top:5px">후기 128건</div>
        </div>
        <div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:6px">
          <sc-for list="{{ ratingBars }}" as="r" hint-placeholder-count="5">
            <div style="display:flex;align-items:center;gap:8px">
              <span style="font-size:10.5px;color:#59503E;width:20px;flex-shrink:0">{{ r.star }}점</span>
              <div style="flex:1;height:6px;border-radius:3px;background:#F0E7D0;overflow:hidden"><div style="{{ r.barStyle }}"></div></div>
              <span style="font-size:10.5px;color:#59503E;width:26px;text-align:right;flex-shrink:0">{{ r.count }}</span>
            </div>
          </sc-for>
        </div>
      </div>
      <div style="border-top:1px solid #FBFAF6;padding-top:16px">
        <div style="font-size:12px;font-weight:700;color:#59503E;margin-bottom:10px">참여자가 많이 남긴 태그</div>
        <div style="display:flex;gap:7px;flex-wrap:wrap">
          <sc-for list="{{ topTags }}" as="t" hint-placeholder-count="5">
            <span style="{{ t.style }}">{{ t.label }} {{ t.count }}</span>
          </sc-for>
        </div>
      </div>
    </div>

    <div style="display:flex;flex-wrap:wrap;gap:7px;margin-bottom:14px">
      <sc-for list="{{ categories }}" as="c" hint-placeholder-count="4">
        <div onClick="{{ c.pick }}" style="{{ c.style }}">{{ c.label }}</div>
      </sc-for>
    </div>

    <div style="display:flex;flex-direction:column;gap:12px">
      <sc-for list="{{ reviewList }}" as="rv" hint-placeholder-count="4">
        <div style="background:#fff;border:1px solid #EDE7D6;border-radius:18px;padding:16px">
          <div style="display:flex;align-items:center;gap:11px;margin-bottom:11px">
            <div style="{{ rv.avatarStyle }}"></div>
            <div style="flex:1;min-width:0">
              <div style="font-size:13px;font-weight:700">{{ rv.author }}</div>
              <div style="font-size:11px;color:#59503E;margin-top:2px">{{ rv.date }} · {{ rv.eventTitle }}</div>
            </div>
            <div style="font-size:11.5px;color:#A86D58;letter-spacing:0.5px;flex-shrink:0">{{ rv.stars }}</div>
          </div>
          <div style="font-size:13px;line-height:1.7;color:#14382A;margin-bottom:11px">{{ rv.body }}</div>
          <div style="display:flex;gap:6px;flex-wrap:wrap">
            <sc-for list="{{ rv.tags }}" as="tg" hint-placeholder-count="2">
              <span style="font-size:11px;padding:4px 9px;border-radius:7px;background:#F5EEDD;color:#14382A;font-weight:600">{{ tg }}</span>
            </sc-for>
          </div>
        </div>
      </sc-for>
    </div>

    <sc-if value="{{ hasMore }}" hint-placeholder-val="{{ true }}">
      <div onClick="{{ loadMore }}" style="margin-top:16px;text-align:center;min-height:44px;box-sizing:border-box;padding:14px;border-radius:13px;border:1px solid #EDE7D6;background:#fff;font-size:13.5px;font-weight:700;cursor:pointer">후기 더 보기</div>
    </sc-if>

    <sc-if value="{{ isEmpty }}" hint-placeholder-val="{{ false }}">
      <div style="text-align:center;padding:64px 20px;color:#59503E">
        <div style="width:52px;height:52px;border-radius:18px;background:#FBFAF6;margin:0 auto 16px"></div>
        <div style="font-size:14px;font-weight:700;color:#14382A;margin-bottom:7px">이 분류의 후기가 아직 없어요</div>
        <div style="font-size:12.5px;line-height:1.7">다른 분류를 눌러보세요</div>
      </div>
    </sc-if>

  </main>

</div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
const THUMBS = ['#EFEADA', '#DDD9C4', '#F1EDDF', '#F5EEDD'];

const RATING_DIST = [
  { star: 5, count: 78 },
  { star: 4, count: 34 },
  { star: 3, count: 11 },
  { star: 2, count: 3 },
  { star: 1, count: 2 },
];

const TOP_TAGS = [
  { label: '분위기 좋아요', count: 62 },
  { label: '진행이 매끄러워요', count: 48 },
  { label: '접근성이 좋아요', count: 31 },
  { label: '재방문 의사 있어요', count: 24 },
];

// 그 주최사의 전 회차 후기가 한 목록에 모인다 (7.4)
const REVIEWS = [
  { id: 1, author: '민서', date: '8/3', eventTitle: '성수 와인 로테이션', rating: 5, body: '테이블 로테이션이 30분 간격이라 어색할 틈이 없었어요. 소믈리에 설명도 짧고 재미있게 해주셔서 좋았습니다.', tags: ['분위기 좋아요', '진행이 매끄러워요'], cats: ['분위기', '진행'] },
  { id: 2, author: '준호', date: '8/2', eventTitle: '성수 와인 로테이션', rating: 4, body: '와인 종류가 다양해서 만족했습니다. 다만 인원이 조금 많아서 후반부엔 소음이 있었어요.', tags: ['분위기 좋아요'], cats: ['분위기'] },
  { id: 3, author: '하윤', date: '7/29', eventTitle: '홍대 하이볼 나이트', rating: 5, body: '역에서 3분 거리라 이동이 편했어요. 진행자분이 대화 주제를 계속 던져주셔서 처음 온 사람도 편하게 어울렸습니다.', tags: ['접근성이 좋아요', '진행이 매끄러워요'], cats: ['장소', '진행'] },
  { id: 4, author: '서연', date: '7/27', eventTitle: '성수 브런치 로테이션', rating: 4, body: '공간이 넓고 조명이 아늑했어요. 진행자분 안내가 조금만 더 자세했으면 좋겠습니다.', tags: ['접근성이 좋아요'], cats: ['장소'] },
  { id: 5, author: '지훈', date: '7/20', eventTitle: '홍대 하이볼 나이트', rating: 5, body: '같은 주최사 소개팅을 세 번째 갔는데 매번 진행이 안정적이라 믿고 신청하게 됩니다.', tags: ['진행이 매끄러워요'], cats: ['진행'] },
];

const CATEGORIES = ['전체', '분위기', '진행', '장소'];
const PAGE_SIZE = 3;

function chip(active) {
  return { minHeight: '44px', boxSizing: 'border-box', display: 'flex', alignItems: 'center', padding: '10px 15px', borderRadius: '999px', fontSize: '12.5px', fontWeight: active ? 700 : 500, cursor: 'pointer', background: active ? '#DDC497' : '#fff', color: '#14382A', border: '1px solid ' + (active ? '#DDC497' : '#EDE7D6') };
}
function stars(n) { return '★★★★★'.slice(0, n) + '☆☆☆☆☆'.slice(0, 5 - n); }

class Component extends DCLogic {
  state = { category: '전체', shown: PAGE_SIZE };

  renderVals() {
    const s = this.state;
    const filtered = REVIEWS.filter(r => s.category === '전체' || r.cats.includes(s.category));
    const visible = filtered.slice(0, s.shown);
    const maxCount = Math.max.apply(null, RATING_DIST.map(r => r.count));

    return {
      ratingBars: RATING_DIST.map(r => ({
        star: r.star,
        count: r.count,
        barStyle: { height: '100%', width: Math.round((r.count / maxCount) * 100) + '%', background: r.star >= 4 ? '#96A377' : '#C9C2AE' },
      })),
      topTags: TOP_TAGS.map(t => ({
        label: t.label,
        count: t.count,
        style: { fontSize: '11.5px', fontWeight: 600, padding: '6px 11px', borderRadius: '999px', background: '#F5EEDD', color: '#14382A' },
      })),

      categories: CATEGORIES.map(c => ({
        label: c,
        style: chip(s.category === c),
        pick: () => this.setState({ category: c, shown: PAGE_SIZE }),
      })),

      reviewList: visible.map((r, i) => ({
        author: r.author,
        date: r.date,
        eventTitle: r.eventTitle,
        body: r.body,
        tags: r.tags,
        stars: stars(r.rating),
        avatarStyle: { width: '34px', height: '34px', borderRadius: '12px', flexShrink: 0, background: THUMBS[i % THUMBS.length] },
      })),

      hasMore: visible.length < filtered.length,
      isEmpty: filtered.length === 0,
      loadMore: () => this.setState(st => ({ shown: st.shown + PAGE_SIZE })),
    };
  }
}
</script>
</body>
</html>
